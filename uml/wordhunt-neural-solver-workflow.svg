<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1280" role="img" aria-labelledby="title desc">
  <title id="title">WordHunt Neural Solver UML activity workflow</title>
  <desc id="desc">Two swimlanes show offline model training and runtime board solving with neural pruning.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#3d3933"/></marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#201d18}.laneTitle{font:700 15px Arial,sans-serif;letter-spacing:2px;fill:#8d2d1f}.body{font:500 16px Arial,sans-serif;fill:#201d18}.small{font:500 13px Arial,sans-serif;fill:#5d574d}.edge{fill:none;stroke:#3d3933;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}.box{fill:#faf7f0;stroke:#6b6455;stroke-width:2}.blue{fill:#e8f1fb;stroke:#2a78d6}.green{fill:#edf6ed;stroke:#4f8a4f}.red{fill:#fce8e6;stroke:#b23a26}.decision{fill:#fff3cd;stroke:#b58b00;stroke-width:2}.label{font:700 13px Arial,sans-serif;fill:#8d2d1f}.final{fill:#b23a26;stroke:#7a281b;stroke-width:3}.white{fill:#fff;font:700 16px Arial,sans-serif}.laneBg{fill:#f8f4eb;stroke:#6b6455;stroke-width:2}.artifact{fill:#fff8e8;stroke:#b58b00;stroke-width:2}
    </style>
  </defs>
  <rect width="1400" height="1280" fill="#f4efe5"/>
  <text class="title" x="700" y="48" text-anchor="middle">WordHunt Neural Solver &#8212; Activity Workflow</text>
  <rect class="laneBg" x="45" y="75" width="640" height="1160" rx="8"/>
  <rect class="laneBg" x="715" y="75" width="640" height="1160" rx="8"/>
  <rect x="45" y="75" width="640" height="48" fill="#ddc89e"/>
  <rect x="715" y="75" width="640" height="48" fill="#ddc89e"/>
  <text class="laneTitle" x="365" y="106" text-anchor="middle">OFFLINE MODEL TRAINING</text>
  <text class="laneTitle" x="1035" y="106" text-anchor="middle">RUNTIME BOARD SOLVING</text>

  <ellipse class="box" cx="365" cy="165" rx="70" ry="30"/>
  <text class="body" x="365" y="171" text-anchor="middle">Start training</text>
  <path class="edge" d="M365 195 V225"/>
  <rect class="blue" x="195" y="225" width="340" height="72" rx="12"/>
  <text class="body" x="365" y="256" text-anchor="middle"><tspan x="365">Load approximately 35,000</tspan><tspan x="365" dy="22">dictionary words</tspan></text>
  <path class="edge" d="M365 297 V327"/>
  <rect class="box" x="180" y="327" width="370" height="82" rx="12"/>
  <text class="body" x="365" y="357" text-anchor="middle"><tspan x="365">Generate labeled prefix/path examples</tspan><tspan x="365" dy="22">retain = useful &#183; prune = dead branch</tspan></text>
  <path class="edge" d="M365 409 V439"/>
  <rect class="box" x="180" y="439" width="370" height="82" rx="12"/>
  <text class="body" x="365" y="469" text-anchor="middle"><tspan x="365">Extract features: letters, path depth,</tspan><tspan x="365" dy="22">prefix shape, neighborhood signal</tspan></text>
  <path class="edge" d="M365 521 V551"/>
  <rect class="green" x="215" y="551" width="300" height="68" rx="12"/>
  <text class="body" x="365" y="592" text-anchor="middle">Train scikit-learn classifier</text>
  <path class="edge" d="M365 619 V649"/>
  <rect class="blue" x="200" y="649" width="330" height="76" rx="12"/>
  <text class="body" x="365" y="679" text-anchor="middle"><tspan x="365">Evaluate held-out candidates</tspan><tspan x="365" dy="22">94.6% accuracy &#183; 91% recall</tspan></text>
  <path class="edge" d="M365 725 V755"/>
  <path class="decision" d="M365 755 L480 815 L365 875 L250 815 Z"/>
  <text class="body" x="365" y="810" text-anchor="middle"><tspan x="365">Quality targets</tspan><tspan x="365" dy="21">met?</tspan></text>
  <text class="label" x="205" y="805">NO</text>
  <path class="edge" d="M250 815 H135 V910"/>
  <rect class="red" x="70" y="910" width="260" height="74" rx="12"/>
  <text class="body" x="200" y="941" text-anchor="middle"><tspan x="200">Tune features, weights,</tspan><tspan x="200" dy="22">or threshold</tspan></text>
  <path class="edge dash" d="M200 910 V585 H215"/>
  <text class="label" x="495" y="805">YES</text>
  <path class="edge" d="M480 815 H560 V910"/>
  <rect class="green" x="390" y="910" width="270" height="74" rx="12"/>
  <text class="body" x="525" y="941" text-anchor="middle"><tspan x="525">Serialize model and</tspan><tspan x="525" dy="22">pruning threshold</tspan></text>
  <path class="edge" d="M525 984 V1020"/>
  <path class="artifact" d="M435 1020 H615 V1105 Q570 1084 525 1105 Q480 1084 435 1105 Z"/>
  <text class="body" x="525" y="1060" text-anchor="middle"><tspan x="525">Model</tspan><tspan x="525" dy="22">artifact</tspan></text>
  <text class="small" x="365" y="1160" text-anchor="middle"><tspan x="365">Objective: reduce traversal while retaining valid words.</tspan><tspan x="365" dy="21">Prototype result: about 17% less search space.</tspan></text>

  <ellipse class="box" cx="1035" cy="165" rx="65" ry="30"/>
  <text class="body" x="1035" y="171" text-anchor="middle">Start solve</text>
  <path class="edge" d="M1035 195 V225"/>
  <rect class="box" x="865" y="225" width="340" height="72" rx="12"/>
  <text class="body" x="1035" y="256" text-anchor="middle"><tspan x="1035">Receive 4 &#215; 4 board</tspan><tspan x="1035" dy="22">and pruning threshold</tspan></text>
  <path class="edge" d="M1035 297 V327"/>
  <rect class="blue" x="865" y="327" width="340" height="72" rx="12"/>
  <text class="body" x="1035" y="357" text-anchor="middle"><tspan x="1035">Seed DFS / trie traversal</tspan><tspan x="1035" dy="22">from every board cell</tspan></text>
  <path class="edge" d="M1035 399 V429"/>
  <rect class="box" x="865" y="429" width="340" height="68" rx="12"/>
  <text class="body" x="1035" y="470" text-anchor="middle">Extend path to an unused neighbor</text>
  <path class="edge" d="M1035 497 V527"/>
  <rect class="green" x="845" y="527" width="380" height="78" rx="12"/>
  <text class="body" x="1035" y="557" text-anchor="middle"><tspan x="1035">Extract features and request</tspan><tspan x="1035" dy="22">neural retain / prune score</tspan></text>
  <path class="edge dash" d="M615 1060 H760 V566 H845"/>
  <text class="small" x="700" y="1045">load for inference</text>
  <path class="edge" d="M1035 605 V635"/>
  <path class="decision" d="M1035 635 L1145 695 L1035 755 L925 695 Z"/>
  <text class="body" x="1035" y="690" text-anchor="middle"><tspan x="1035">Score meets</tspan><tspan x="1035" dy="21">threshold?</tspan></text>
  <text class="label" x="875" y="684">NO</text>
  <path class="edge" d="M925 695 H810 V795"/>
  <rect class="red" x="750" y="795" width="240" height="72" rx="12"/>
  <text class="body" x="870" y="825" text-anchor="middle"><tspan x="870">Prune branch</tspan><tspan x="870" dy="22">Do not expand</tspan></text>
  <text class="label" x="1160" y="684">YES</text>
  <path class="edge" d="M1145 695 H1240 V775"/>
  <path class="decision" d="M1240 775 L1330 830 L1240 885 L1150 830 Z"/>
  <text class="body" x="1240" y="825" text-anchor="middle"><tspan x="1240">Complete</tspan><tspan x="1240" dy="21">word?</tspan></text>
  <text class="label" x="1260" y="910">YES</text>
  <path class="edge" d="M1240 885 V925"/>
  <rect class="green" x="1110" y="925" width="260" height="72" rx="12"/>
  <text class="body" x="1240" y="955" text-anchor="middle"><tspan x="1240">Store word, path,</tspan><tspan x="1240" dy="22">and confidence</tspan></text>

  <path class="edge" d="M870 867 V1040 H940"/>
  <path class="edge" d="M1240 997 V1040 H1130"/>
  <path class="edge" d="M1150 830 H1085 V1015"/>
  <path class="decision" d="M1035 1015 L1130 1070 L1035 1125 L940 1070 Z"/>
  <text class="body" x="1035" y="1065" text-anchor="middle"><tspan x="1035">More valid</tspan><tspan x="1035" dy="21">extensions?</tspan></text>
  <text class="label" x="900" y="1058">YES</text>
  <path class="edge dash" d="M940 1070 H770 V463 H865"/>
  <text class="label" x="1145" y="1058">NO</text>
  <path class="edge" d="M1130 1070 H1270 V1140"/>
  <rect class="final" x="1080" y="1140" width="330" height="78" rx="12"/>
  <text class="white" x="1245" y="1170" text-anchor="middle"><tspan x="1245">Return words, paths, confidence,</tspan><tspan x="1245" dy="23">pruned %, recall, and runtime</tspan></text>
</svg>
