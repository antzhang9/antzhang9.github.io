<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>World currencies</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fff9de">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#25304b; --accent:#4a82cf; --accent-d:#2f5fa8; --brick:#cf6a52;
    --sea:#fbeea0; --land-edge:rgba(255,255,255,.85);
    --paper:#fff9de; --card:#fffef6; --muted:#7a7355;
    --soft:rgba(37,48,75,.08); --shadow:0 10px 30px rgba(120,100,30,.16);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:'Nunito', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
    color:var(--ink);
    background:var(--paper);
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  h1,h2{ font-family:'Nunito', ui-rounded, system-ui, sans-serif; font-weight:800; margin:0; letter-spacing:-.01em; }

  /* ---------- top bar ---------- */
  .bar{
    flex:none; position:relative; z-index:3;
    display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:10px 24px;
    padding:14px 3vw 14px;
    background:var(--paper);
    border-radius:0 0 28px 28px;
    box-shadow:0 8px 24px rgba(120,100,30,.10);
  }
  .title{ min-width:0; }
  .title .sub{ margin:4px 0 0; font-size:.8rem; line-height:1.4; color:var(--muted); max-width:62ch; min-height:2.8em; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .eyebrow{ display:flex; align-items:center; gap:7px; font-size:.78rem; font-weight:700; color:var(--accent); margin-bottom:3px; }
  .eyebrow::before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--accent); }
  .title h1{ font-size:clamp(1.15rem,2.2vw,1.6rem); line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* the conversion controls float over the map (desktop), so the header never changes shape between modes */
  .controls{
    position:fixed; z-index:6; right:calc(3vw + 58px); bottom:34px;
    display:flex; align-items:flex-end; gap:10px 12px;
    padding:12px 16px 14px; border-radius:30px;
    background:rgba(255,254,246,.88); backdrop-filter:blur(6px);
    box-shadow:0 8px 26px rgba(120,100,30,.18);
  }
  .controls[hidden]{ display:none; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:.74rem; font-weight:700; color:var(--muted); padding-left:14px; }
  input, select, button{ font:inherit; color:var(--ink); }
  input[type=number], input[type=search], select{
    height:42px; padding:0 16px;
    border:0; border-radius:999px; background:#fff;
    box-shadow:inset 0 0 0 2px rgba(74,130,207,.14), 0 2px 6px rgba(120,100,30,.06);
    font-size:.92rem; font-weight:600;
    transition:box-shadow .2s ease;
  }
  input::placeholder{ color:#a29b78; font-weight:500; }
  input[type=number]:focus, input[type=search]:focus, select:focus{ outline:0; box-shadow:inset 0 0 0 2px var(--accent), 0 2px 6px rgba(120,100,30,.06); }
  input[type=number]{ width:96px; }
  input[type=search]{ width:178px; }
  select{ max-width:240px; padding-right:10px; }
  .btn{
    height:42px; padding:0 20px;
    border:0; border-radius:999px;
    background:var(--accent); color:#fff;
    font-size:.88rem; font-weight:700;
    cursor:pointer; box-shadow:0 4px 12px rgba(74,130,207,.32);
    transition:background .2s ease, transform .15s ease;
  }
  .btn:hover{ background:var(--accent-d); }
  .btn:active{ transform:scale(.96); }
  .btn.quiet{ background:#fff; color:var(--ink); box-shadow:inset 0 0 0 2px rgba(74,130,207,.14), 0 2px 6px rgba(120,100,30,.06); }
  .btn.quiet:hover{ background:#eef4fc; }
  :focus-visible{ outline:3px solid rgba(74,130,207,.5); outline-offset:3px; border-radius:999px; }

  /* ---------- mode wheel (coin -> Big Mac -> boba) ---------- */
  .wheel{
    display:flex; align-items:center; gap:14px;
    border:0; background:transparent; padding:0 6px 0 0; cursor:pointer; text-align:left;
    -webkit-tap-highlight-color:transparent;
  }
  .knob{ position:relative; flex:none; width:60px; height:60px; perspective:340px; }
  .knob .rim{
    position:absolute; inset:0; border-radius:50%;
    background:repeating-conic-gradient(#fff 0 7deg, #dce8f8 7deg 14deg);
    box-shadow:0 7px 16px rgba(47,95,168,.26), inset 0 0 0 2px rgba(255,255,255,.9);
    transition:transform .6s cubic-bezier(.3,1.4,.5,1);
  }
  .knob .cap{
    position:absolute; inset:7px; border-radius:50%;
    display:grid; place-items:center; font-size:26px; line-height:1;
    background:radial-gradient(circle at 35% 30%, #fff, #eaf2fc 72%);
    box-shadow:0 2px 6px rgba(47,95,168,.25);
    font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  }
  .cap svg{ width:30px; height:30px; display:block; }
  .wheel:active .knob{ filter:brightness(.97); }
  .modes{ display:flex; flex-direction:column; gap:1px; font-size:.8rem; font-weight:700; line-height:1.3; }
  .modes span{ display:flex; align-items:center; gap:7px; color:#a29b78; transition:color .25s ease, transform .25s ease; }
  .modes span::before{ content:""; width:6px; height:6px; border-radius:50%; background:transparent; transition:background .25s ease; }
  .modes span.on{ color:var(--ink); transform:translateX(2px); }
  .modes span.on::before{ background:var(--accent); }
  .u-emoji{ font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif; }

  /* ---------- map ---------- */
  .stage{ position:relative; flex:1 1 auto; min-height:0; background:var(--paper); }
  svg#map{
    position:absolute; inset:0; width:100%; height:100%;
    display:block; touch-action:none; cursor:grab;
    -webkit-user-select:none; user-select:none;
  }
  svg#map.is-panning{ cursor:grabbing; }
  .sphere{ fill:var(--sea); stroke:rgba(190,160,40,.28); stroke-width:1.5; vector-effect:non-scaling-stroke; }
  .grat{ fill:none; stroke:rgba(255,255,255,.55); stroke-width:.8; vector-effect:non-scaling-stroke; }
  .country{
    stroke:var(--land-edge); stroke-width:.7; vector-effect:non-scaling-stroke;
    stroke-linejoin:round;
    transition:opacity .2s ease;
  }
  .country.nodata{ fill:url(#hatch) !important; }
  .country.is-target{ stroke:#fff; stroke-width:1.1; }
  .country.kin{ stroke:var(--ink); stroke-width:1.5; }
  .country.dim{ opacity:.55; }
  .hit{ fill:transparent; stroke:none; }
  #hover path{
    stroke:#fff; stroke-width:2; vector-effect:non-scaling-stroke; stroke-linejoin:round;
    filter:drop-shadow(0 8px 10px rgba(40,60,110,.4));
    transform-box:fill-box; transform-origin:center;
    transition:transform .17s cubic-bezier(.3,.1,.2,1);
  }
  #labels text{ font-family:'Nunito', ui-rounded, system-ui, sans-serif; text-anchor:middle; pointer-events:none; }
  #labels .v{ font-weight:800; }
  #labels .u{ font-weight:600; opacity:.8; }

  /* ---------- overlays ---------- */
  .legend{
    position:absolute; left:3vw; bottom:16px;
    display:flex; flex-direction:column; gap:6px;
    font-size:.74rem; font-weight:700; color:var(--muted);
    pointer-events:none;
    background:rgba(255,254,246,.8); padding:10px 16px 11px; border-radius:20px;
    box-shadow:0 4px 14px rgba(120,100,30,.10);
  }
  .legend .ramp{ width:190px; height:10px; border-radius:999px;
    background:linear-gradient(90deg,#e1eefb,#a9cdf2 38%,#6199de 70%,#2f5fa8); }
  .legend .row{ display:flex; justify-content:space-between; width:190px; }
  .legend .key{ display:flex; align-items:center; gap:8px; margin-top:2px; }
  .legend .sw{ width:12px; height:12px; border-radius:50%; background:#14234d; }
  .zoom{
    position:absolute; right:3vw; bottom:16px; display:flex; flex-direction:column; gap:8px;
  }
  .zoom button{
    width:42px; height:42px; border:0; border-radius:50%; background:var(--card);
    box-shadow:0 4px 12px rgba(120,100,30,.18);
    font-size:1.15rem; font-weight:700; line-height:1; cursor:pointer;
    transition:background .2s ease, transform .15s ease;
  }
  .zoom button:hover{ background:#e7f0fb; }
  .zoom button:active{ transform:scale(.94); }
  .credit{
    position:absolute; left:50%; bottom:8px; transform:translateX(-50%);
    font-size:.68rem; font-weight:600; color:var(--muted); white-space:nowrap; pointer-events:auto;
    background:rgba(255,254,246,.8); padding:3px 12px; border-radius:999px;
  }
  .credit a{ color:inherit; }
  .status{
    position:absolute; left:50%; top:14px; transform:translateX(-50%);
    background:var(--card); border-radius:999px;
    padding:9px 18px; font-size:.84rem; font-weight:600; box-shadow:var(--shadow);
    z-index:5; max-width:92vw; text-align:center;
  }
  .status[hidden]{ display:none; }

  /* ---------- info card ---------- */
  .card{
    position:fixed; z-index:20; left:0; top:0;
    width:326px; max-width:92vw;
    background:var(--card);
    border-radius:26px;
    padding:18px 20px 16px;
    box-shadow:0 22px 50px rgba(60,70,110,.28), 0 2px 8px rgba(60,70,110,.08);
    pointer-events:none;
    opacity:0; transform:translateY(4px);
    transition:opacity .14s ease, transform .14s ease;
  }
  .card.is-on{ opacity:1; transform:none; }
  .card-top{ display:flex; gap:14px; align-items:center; margin-bottom:12px; }
  .mini{ flex:none; width:68px; height:68px; background:var(--sea); border-radius:20px; }
  .mini path{ fill:#6199de; stroke:#fff; stroke-width:1.2; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .card h2{ font-size:1.3rem; line-height:1.15; }
  .card .sub{ font-size:.78rem; font-weight:600; color:var(--muted); margin-top:3px; }
  .big{ font-size:1.5rem; font-weight:800; line-height:1.2; padding:10px 14px 8px; background:#eef4fc; border-radius:18px; margin-bottom:10px; }
  .big .eq{ color:var(--muted); font-size:.95rem; font-weight:700; }
  .rev{ font-size:.84rem; line-height:1.4; color:var(--muted); margin:0 6px 12px; }
  dl{ margin:0 6px; display:grid; grid-template-columns:auto 1fr; gap:7px 14px; font-size:.84rem; }
  dt{ color:var(--muted); font-size:.76rem; font-weight:700; padding-top:1px; }
  dd{ margin:0; line-height:1.35; font-weight:600; }
  .card .close{
    display:none; position:absolute; right:10px; top:8px; width:44px; height:44px;
    border:0; background:transparent; font-size:1.5rem; cursor:pointer; pointer-events:auto;
  }
  @media (hover:none), (max-width:700px){
    .card{ left:0 !important; right:0; top:auto !important; bottom:0; width:100%; max-width:100%;
      max-height:62vh; overflow:auto; border-radius:28px 28px 0 0; transform:translateY(12px); padding-bottom:calc(16px + env(safe-area-inset-bottom,0px)); }
    .card.is-on{ pointer-events:auto; transform:none; }
    .card .close{ display:block; }
    .legend, .credit{ display:none; }
    .zoom{ bottom:auto; top:10px; }
  }
  @media (max-width:999px){
    .bar{ grid-template-columns:auto minmax(0,1fr) auto; }
    .controls{
      position:static; grid-column:1 / -1; justify-content:flex-start; flex-wrap:wrap;
      padding:0; border-radius:0; background:transparent; box-shadow:none; backdrop-filter:none;
    }
  }
  @media (max-width:700px){
    .bar{ grid-template-columns:1fr; padding:12px 14px 14px; gap:8px; border-radius:0 0 24px 24px; }
    .eyebrow{ display:none; }
    .knob{ width:50px; height:50px; } .knob .cap{ inset:6px; font-size:22px; } .cap svg{ width:26px; height:26px; }
    .modes{ flex-direction:row; gap:14px; font-size:.84rem; }
    .title h1{ font-size:1.02rem; white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; min-height:2.5em; }
    .title .sub{ font-size:.74rem; }
    .field.find{ order:3; }
    .controls{ order:4; display:grid; grid-template-columns:82px 1fr 96px; gap:8px; width:100%; }
    .controls .field.grow{ min-width:0; grid-column:span 2; }
    select{ max-width:none; width:100%; }
    input[type=number]{ width:100%; }
    .controls .btn{ width:100%; }
    #dir{ grid-column:span 2; }
    input[type=search]{ width:100%; }
    .card{ max-height:46vh; }
  }
  @media (prefers-reduced-motion:reduce){
    #hover path, .card, .country, .knob .rim{ transition:none; }
  }
</style>
</head>
<body>

<header class="bar">
  <button type="button" class="wheel" id="wheel">
    <span class="knob" id="knob" aria-hidden="true"><span class="rim"></span><span class="cap" id="cap"></span></span>
    <span class="modes" aria-hidden="true"><span data-m="value">Currency</span><span data-m="bigmac">Big Mac</span><span data-m="boba">Boba</span></span>
  </button>
  <div class="title">
    <span class="eyebrow">World currencies</span>
    <h1 id="headline">Loading rates…</h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="field find">
    <label for="find">Find a country</label>
    <input id="find" type="search" list="countryList" placeholder="Type a name" autocomplete="off">
    <datalist id="countryList"></datalist>
  </div>
  <div class="controls" id="controls">
    <div class="field" id="amountField">
      <label for="amount">Amount</label>
      <input id="amount" type="number" inputmode="decimal" value="1" min="0" step="any">
    </div>
    <div class="field grow" id="targetField">
      <label for="target">Currency</label>
      <select id="target" aria-label="Currency to convert to or from"></select>
    </div>
    <button class="btn quiet" id="dir" type="button" aria-pressed="false" title="Switch which way the conversion runs"></button>
    <button class="btn" id="random" type="button">Random</button>
  </div>
</header>

<main class="stage" id="stage">
  <svg id="map" viewBox="0 0 1000 487" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="World map in the Equal Earth projection. Each country shows what one unit of its currency is worth in the chosen currency. Hover or tap a country for details, or use Find a country.">
    <defs>
      <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="5" height="5" fill="#fff8dc"/><line x1="0" y1="0" x2="0" y2="5" stroke="#ecdc94" stroke-width="1.4"/>
      </pattern>
    </defs>
    <g id="vp">
      <path class="sphere" id="sphere"/>
      <path class="grat" id="grat"/>
      <g id="countries"></g>
      <g id="labels"></g>
      <g id="hover" pointer-events="none"></g>
    </g>
  </svg>

  <div class="status" id="status" role="status">Loading live exchange rates…</div>

  <div class="legend" aria-hidden="true">
    <div class="ramp"></div>
    <div class="row"><span id="legendLo">Worth less per unit</span><span>More</span></div>
    <div class="key"><span class="sw"></span><span id="legendKey">Uses this currency</span></div>
    <div class="key"><span class="sw" style="background:#fff8dc;box-shadow:inset 0 0 0 1.5px #ecdc94"></span><span id="legendNo">No live rate</span></div>
  </div>
  <div class="zoom">
    <button id="zin" type="button" aria-label="Zoom in">+</button>
    <button id="zout" type="button" aria-label="Zoom out">&minus;</button>
    <button id="zreset" type="button" aria-label="Reset the view" style="font-size:.7rem">1&times;</button>
  </div>
  <div class="credit" id="credit">
    Rates by <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">Exchange Rate API</a> · outlines Natural Earth · country data mledoze/countries · Big Mac prices The Economist
  </div>
</main>

<aside class="card" id="card" aria-live="polite">
  <button class="close" id="cardClose" type="button" aria-label="Close details">&times;</button>
  <div class="card-top">
    <svg class="mini" id="mini" viewBox="0 0 10 10" aria-hidden="true"><path id="miniPath"/></svg>
    <div><h2 id="cName"></h2><div class="sub" id="cSub"></div></div>
  </div>
  <div class="big" id="cBig"></div>
  <div class="rev" id="cRev"></div>
  <dl id="cFacts"></dl>
</aside>

  // one wheel, three stops: each click turns it to the next mode (so two clicks reach the last one, a third comes back round)
  var MODES = ['value', 'bigmac', 'boba'], MODE_NAMES = { value:'Currency', bigmac:'Big Mac', boba:'Boba' }, wheelRot = 0;
  var COIN = '<svg viewBox="0 0 32 32" aria-hidden="true"><defs><radialGradient id="gold" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fff0a8"/><stop offset=".55" stop-color="#f5c542"/><stop offset="1" stop-color="#d99a1c"/></radialGradient></defs><circle cx="16" cy="16" r="14.5" fill="url(#gold)" stroke="#c98a14" stroke-width="1.2"/><circle cx="16" cy="16" r="10.6" fill="none" stroke="#b97d10" stroke-opacity=".55" stroke-width="1.1"/><g fill="none" stroke="#9a6608" stroke-width="1.7" stroke-linecap="round"><circle cx="16" cy="16" r="3.3"/><path d="M13.7 13.7 11.4 11.4M18.3 13.7l2.3-2.3M13.7 18.3l-2.3 2.3M18.3 18.3l2.3 2.3"/></g></svg>';
  var FACE = { value:COIN, bigmac:'\uD83C\uDF54', boba: BOBA_OK ? '\uD83E\uDDCB' : '\uD83E\uDD64' };   // coin, 🍔, 🧋 (🥤 if 🧋 can't be drawn)
  var faceMode = null, pendingFace = null;
  function setFace(m){ faceMode = m; pendingFace = null; $('cap').innerHTML = FACE[m]; }
  // coin-flip: edge-on, swap the face, then keep spinning and settle
  function flipTo(m){
    var cap = $('cap');
    if(reduced || !cap.animate){ setFace(m); return; }
    if(pendingFace) setFace(pendingFace);
    cap.getAnimations().forEach(function(a){ a.cancel(); });
    pendingFace = m;
    var a = cap.animate([{ transform:'rotateY(0deg)' }, { transform:'rotateY(90deg)' }], { duration:170, easing:'ease-in', fill:'forwards' });
    a.onfinish = function(){
      setFace(m);
      cap.animate([{ transform:'rotateY(90deg) scale(1)' }, { transform:'rotateY(250deg) scale(1.12)', offset:.55 }, { transform:'rotateY(360deg) scale(1)' }], { duration:620, easing:'cubic-bezier(.2,.8,.3,1)' });
      a.cancel();
    };
  }
  function syncWheel(){
    $('knob').firstChild.style.transform = 'rotate(' + wheelRot + 'deg)';
    if(faceMode === null) setFace(state.mode);
    Array.prototype.forEach.call(document.querySelectorAll('#wheel .modes span'), function(el){ el.classList.toggle('on', el.getAttribute('data-m') === state.mode); });
    var nxt = MODES[(MODES.indexOf(state.mode) + 1) % MODES.length];
    $('wheel').setAttribute('aria-label', 'Mode: ' + MODE_NAMES[state.mode] + '. Click for ' + MODE_NAMES[nxt] + '.');
  }
  $('wheel').addEventListener('click', function(){
    if(!R) return;
    wheelRot += 120;
    var nx = MODES[(MODES.indexOf(state.mode) + 1) % MODES.length];
    flipTo(nx);
    setMode(nx);
  });
  $('dir').addEventListener('click', function(){ state.dir = state.dir === 'to' ? 'from' : 'to'; paint(); });
  $('amount').addEventListener('input', function(){
    var v = parseFloat(this.value); state.amount = (isFinite(v) && v > 0) ? v : 1; if(R) paint();
  });
  var lookup = {};
  C.forEach(function(c, i){ lookup[c.n.toLowerCase()] = i; });
  C.slice().sort(function(a, b){ return a.n.localeCompare(b.n); }).forEach(function(c){
    var o = document.createElement('option'); o.value = c.n; $('countryList').appendChild(o);
  });
  $('find').addEventListener('change', function(){
    var i = lookup[this.value.trim().toLowerCase()];
    if(i === undefined) return;
    state.pinned = true; focusCountry(C[i]);
    // show the card after the zoom settles, anchored near the middle of the map
    setTimeout(function(){
      showHover(i);
      if(!coarse.matches){ var r = stage.getBoundingClientRect(); placeCard(r.left + r.width * .56, r.top + r.height * .42); }
    }, reduced ? 0 : 480);
    this.blur();
  });
  window.addEventListener('resize', function(){ scheduleLabels(); });

  // ---------------------------------------------------------------- rates
  var CACHE_KEY = 'wc-rates-v1';
  function useRates(rates, when, fromCache){
    R = rates; rateDate = when;
    C.forEach(function(c){                  // the currency that actually has a live rate comes first
      var hit = c.cu.filter(function(x){ return R[x.c]; })[0];
      c.prim = hit ? hit.c : (c.cu[0] ? c.cu[0].c : null);
    });
    computeShade(); computeRank();
    var codes = Object.keys(names).filter(function(k){ return R[k]; }).sort();
    $('target').innerHTML = codes.map(function(k){ return '<option value="' + k + '">' + k + ' — ' + esc(names[k]) + '</option>'; }).join('');
    var want = (new URLSearchParams(location.search).get('c') || '').toUpperCase();
    state.target = (want && R[want] && names[want]) ? want : randomTarget();
    $('target').value = state.target;
    var wm = new URLSearchParams(location.search).get('m') || '';
    if(wm === 'bigmac' || wm === 'boba') state.mode = wm;
    wheelRot = MODES.indexOf(state.mode) * 120;
    computeShade();
    paint();
    var st = $('status');
    if(fromCache){ st.textContent = 'Couldn’t reach the live feed, so these are saved rates from ' + when + '.'; st.hidden = false; setTimeout(function(){ st.hidden = true; }, 6000); }
    else st.hidden = true;
    $('credit').insertAdjacentHTML('beforeend', ' · rates updated ' + esc(when));
  }
  function failRates(){
    $('status').textContent = 'Couldn’t load live exchange rates. Check your connection and reload.';
    $('headline').textContent = 'Rates unavailable';
  }
  fetch('https://open.er-api.com/v6/latest/USD', { cache:'no-store' })
    .then(function(r){ if(!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .then(function(j){
      if(!j || j.result !== 'success' || !j.rates) throw new Error('bad payload');
      var when = (j.time_last_update_utc || '').replace(/ \+0000$/, '').replace(/^[A-Za-z]+, /, '');
      try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ rates:j.rates, when:when })); }catch(_){}
      useRates(j.rates, when, false);
    })
    .catch(function(){
      var saved = null;
      try{ saved = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); }catch(_){}
      if(saved && saved.rates) useRates(saved.rates, saved.when, true); else failRates();
    });
  // Phones are portrait: start zoomed in on Europe/Africa so the map fills the screen.
  function initialView(){
    if(!(coarse.matches && innerHeight > innerWidth)) return;
    var s0 = svg.getBoundingClientRect().width / W, sh = svg.getBoundingClientRect().height;
    if(!s0 || sh < H * s0 * 1.4) return;
    K = Math.min(2.8, sh / (H * s0));
    TX = W / 2 - W * .52 * K; TY = H / 2 - (H / 2) * K;
  }
  initialView();
  applyView();
})();
</script>
</body>
